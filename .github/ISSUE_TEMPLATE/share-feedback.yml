name: Suggest an improvement to the handbook
description: Share a missing question, correction, proposed removal, useful resource or clearer way to help graduate researchers.
title: "[Reader feedback] "
labels: ["type: reader-feedback", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the handbook. You do not need to understand GitHub, edit the book or write code.

        Do not include names, personal information, participant data, confidential research, private correspondence, complaints casework, credentials or unpublished sensitive findings. Describe the general situation and remove identifying details.
  - type: dropdown
    id: feedback_type
    attributes:
      label: What would you like to tell us?
      options:
        - A question or situation is missing
        - Something is unclear, wrong or potentially misleading
        - Something should be shortened, combined, replaced or removed
        - A checklist, template or example is missing
        - I found a useful source or piece of evidence
        - The handbook was difficult to read, navigate or access
        - A local rule or practice needs clearer boundaries
        - Something else
    validations:
      required: true
  - type: textarea
    id: reader_goal
    attributes:
      label: What were you trying to find out or do?
      description: Write the question or task in the words a graduate researcher might use.
    validations:
      required: true
  - type: textarea
    id: current_problem
    attributes:
      label: What should be added, corrected, reconsidered or removed?
      description: Include a page link or section heading if you have one. You do not need to propose replacement wording.
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: What could happen if the handbook does not address this?
      description: Describe likely confusion, wasted effort, error or harm. Say "minor" if the feedback is low risk.
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: When might a researcher need this?
      options:
        - Starting candidature
        - Choosing a topic or research question
        - Planning a study
        - Seeking ethics or governance approval
        - Collecting or managing data
        - Analysing or interpreting findings
        - Writing a thesis chapter or study
        - Preparing or revising a manuscript
        - Examination, corrections or completion
        - When a project is blocked or has failed
        - More than one stage
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional source or example
      description: Link material you are allowed to share, explain why it is relevant, and say whether it applies generally or only in a particular context. Do not paste confidential or copyrighted material.
  - type: dropdown
    id: credit
    attributes:
      label: If the suggestion is used, how would you like to be credited?
      options:
        - Use my GitHub name
        - Credit my organisation
        - Use a pseudonym that I provide below
        - Do not credit me publicly
    validations:
      required: true
  - type: input
    id: credit_name
    attributes:
      label: Optional organisation or pseudonym
  - type: checkboxes
    id: privacy
    attributes:
      label: Public submission check
      options:
        - label: I have removed personal, confidential, security-sensitive and unpublished material that I cannot share publicly.
          required: true
