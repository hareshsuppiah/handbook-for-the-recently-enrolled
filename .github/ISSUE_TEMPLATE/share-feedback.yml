name: Suggest an improvement
description: Tell us what you noticed, what should change and why it would help a graduate researcher.
labels: ["type: reader-feedback", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for one suggestion. You do not need to edit the handbook, write replacement text or understand how GitHub works.

        Your answers will be public. Remove names, personal information, participant data, confidential research, private correspondence, complaints casework, passwords and unpublished sensitive findings. Describe the general situation instead.
  - type: dropdown
    id: suggestion_type
    attributes:
      label: What kind of improvement are you suggesting?
      options:
        - Add a missing question, topic, checklist, template or example
        - Correct or clarify something
        - Shorten, combine or remove something
        - Share a source or useful example
        - Report a reading, navigation, accessibility or technical problem
        - Clarify where advice does and does not apply
        - Something else
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where in the handbook does this apply?
      description: Paste the page link and name the heading. If the material is missing, say where you expected to find it.
      placeholder: "Example: Planning a study > Pilots, or: I expected this in the pilot checklist"
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: What did you notice?
      description: Describe what is missing, unclear, wrong, repetitive or difficult to use. For a missing topic, write the question a graduate researcher would ask.
      placeholder: "Example: The pilot guidance covers instruments and analysis, but not a change to recruitment."
    validations:
      required: true
  - type: textarea
    id: proposed_change
    attributes:
      label: What would you change?
      description: Describe the result you want. You do not need to write polished replacement text.
      placeholder: "Example: Add a prompt asking whether the change affects feasibility, consent or an existing ethics approval."
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would this help a graduate researcher?
      description: Explain the likely benefit or the confusion, error, wasted time or harm it could prevent. Write "Small clarity edit" if that is enough.
      placeholder: "Example: It would prompt a student to check the change before starting recruitment."
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: When would this matter most?
      options:
        - Before candidature starts
        - Starting a doctorate
        - Choosing a topic or research question
        - Planning a study
        - Seeking ethics or governance approval
        - Collecting or managing data
        - Analysing or interpreting findings
        - Writing a thesis chapter or study
        - Preparing or revising a manuscript
        - Examination, corrections or completion
        - When a project is blocked or has failed
        - More than one stage
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, sources or shareable examples (optional)
      description: Add links you are allowed to share. Say what each item supports and whether it is limited to a country, institution, discipline or method. It is fine to have no source yet.
      placeholder: "Link the source and explain what it supports and where it applies."
  - type: input
    id: credit
    attributes:
      label: How should we credit you if the suggestion is used?
      description: Enter your GitHub username, preferred name or organisation, a pseudonym, or "no public credit".
      placeholder: "Example: Use my GitHub username"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send this public suggestion
      options:
        - label: I have removed personal, confidential, security-sensitive and unpublished material that should not be public.
          required: true
        - label: I understand that the suggestion and my GitHub username will be public.
          required: true
