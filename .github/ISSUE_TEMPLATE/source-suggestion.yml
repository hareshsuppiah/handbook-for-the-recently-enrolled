name: Suggest a source or piece of evidence
description: Suggest authoritative evidence or guidance relevant to a handbook claim.
title: "[Source suggestion]: "
labels: ["type: evidence", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Do not include personal data, participant data, confidential research, private correspondence, complaints casework, credentials or unpublished sensitive findings. Link to material you are allowed to share.
  - type: input
    id: source
    attributes:
      label: Source link or citation
      description: Prefer an official, primary or peer-reviewed source.
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What handbook claim or question does it support, qualify or challenge?
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Where might it be relevant?
      description: Link a page or name a chapter or resource if known.
  - type: textarea
    id: boundaries
    attributes:
      label: Are there important limits?
      description: Note the jurisdiction, discipline, method, population, date or other boundary if known.
  - type: dropdown
    id: credit
    attributes:
      label: Credit preference
      options: [Named credit, Organisational credit, Pseudonymous credit, No public credit]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and sharing check
      options:
        - label: I am allowed to share this link or citation and have removed sensitive material.
          required: true
