name: Report an accessibility or technical problem
description: Report a problem with rendering, navigation, search, mobile use, keyboard use or assistive technology.
title: "[Accessibility or technical]: "
labels: ["type: accessibility-technical", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Do not include personal data, passwords, credentials, private screenshots or security-sensitive details.
  - type: input
    id: page
    attributes:
      label: Which page has the problem?
      description: Paste the public page link.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you tried, what you expected and what occurred.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, browser or assistive technology
      description: For example, iPhone with Safari, Windows with Firefox, keyboard only, or a named screen reader. Do not include account details.
  - type: textarea
    id: impact
    attributes:
      label: What could you not read or do?
    validations:
      required: true
  - type: dropdown
    id: credit
    attributes:
      label: Credit preference
      options: [Named credit, Organisational credit, Pseudonymous credit, No public credit]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed personal, confidential and security-sensitive information.
          required: true
