name: Suggest a missing question or resource
description: Tell the editor about a missing question, topic, checklist, template, example or decision aid. No editing or coding is required.
title: "[Content suggestion]: "
labels: ["type: content", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Do not include personal data, participant data, confidential research, private correspondence, complaints casework, credentials or unpublished sensitive findings. Generalise and redact. You are suggesting a change; you are not being asked to edit the handbook.
  - type: textarea
    id: question
    attributes:
      label: What would the graduate researcher ask?
      description: Write the question in the words a student might use.
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: When might this arise?
      options:
        - Before enrolment or starting
        - First 90 days
        - Choosing a topic or question
        - Reviewing literature
        - Designing the research
        - Ethics, integrity or governance
        - Collecting, managing or analysing data
        - Using software, code, GitHub or AI
        - Managing the project or supervision
        - Writing, publishing or communicating
        - Examination, corrections or completion
        - Disruption, failure or feeling stuck
        - More than one stage
        - Unsure
    validations:
      required: true
  - type: textarea
    id: insufficiency
    attributes:
      label: What is missing, unclear or wrong now?
      description: Link the relevant page if there is one. Describe the gap or problem rather than editing the page yourself.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: What could happen if this is not addressed?
      description: Describe the likely confusion, error, wasted effort or harm. Say "low risk" if the change is minor.
    validations:
      required: true
  - type: textarea
    id: variations
    attributes:
      label: Who or what kind of project might be affected?
      description: For example, part-time students, laboratory projects, qualitative studies, international candidates or a particular jurisdiction.
  - type: checkboxes
    id: aid
    attributes:
      label: What might help?
      description: Select any that apply. The editor will decide the final form.
      options:
        - label: A clearer explanation
        - label: A checklist
        - label: A template
        - label: A worked example
        - label: A decision aid or "I'm stuck" pathway
        - label: A source or further reading
  - type: textarea
    id: evidence
    attributes:
      label: Optional evidence or example
      description: Link an official, primary or peer-reviewed source if you have one and say what it supports. Do not paste copyrighted or confidential material.
  - type: dropdown
    id: credit
    attributes:
      label: Credit preference
      options:
        - Named credit
        - Organisational credit
        - Pseudonymous credit
        - No public credit
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed personal, confidential, security-sensitive and unpublished material that I cannot share.
          required: true
