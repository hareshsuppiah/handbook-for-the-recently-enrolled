name: Suggest a clearly bounded local adaptation
description: Suggest a practice that applies to a particular institution, jurisdiction, discipline or method.
title: "[Local adaptation]: "
labels: ["type: local-adaptation", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Do not include personal data, participant data, confidential research, private correspondence, complaints casework, credentials or unpublished sensitive findings. A local rule will not be presented as universal.
  - type: textarea
    id: practice
    attributes:
      label: What local practice or requirement should be explained?
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Where does it apply?
      description: Name the institution, jurisdiction, discipline, method or project type.
    validations:
      required: true
  - type: textarea
    id: reader_need
    attributes:
      label: What would a graduate researcher need to know or decide?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Current official source
      description: Link the governing policy or guidance and include its date if known.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: How should the boundary be stated?
      description: Explain what should not be generalised beyond this setting.
    validations:
      required: true
  - type: dropdown
    id: credit
    attributes:
      label: Credit preference
      options: [Named credit, Organisational credit, Pseudonymous credit, No public credit]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed personal, confidential, security-sensitive and unpublished material that I cannot share.
          required: true
