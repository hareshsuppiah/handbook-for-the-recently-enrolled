name: Quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the editorial approval workflow
        run: python3 scripts/verify_editorial_workflow.py
      - name: Test editorial agent boundaries
        run: python3 scripts/test_editorial_agent.py
      - name: Test offline book integrity checks
        run: python3 scripts/test_finish_epub.py
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render from a clean checkout
        run: quarto render
      - name: Verify chapters, resources, citations and links
        run: python3 scripts/verify_book.py
      - name: Verify reader tools and downloads
        run: python3 scripts/verify_reader_experience.py
