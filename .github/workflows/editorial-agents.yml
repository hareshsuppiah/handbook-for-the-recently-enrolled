name: Editorial triage and draft review

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, ready_for_review, synchronize, review_requested]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: editorial-agent-${{ github.repository_id }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  editorial-agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request == null &&
      (github.event_name == 'issues' || github.event.comment.user.type != 'Bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Never execute files from an untrusted PR with these credentials.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Copilot CLI
        run: npm install --global @github/copilot@1.0.83
      - name: Run bounded editorial assistant
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN || secrets.COPILOT_USER_TOKEN }}
          COPILOT_USER_TOKEN: ${{ secrets.COPILOT_USER_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch) python3 scripts/editorial_agent.py check ;;
            pull_request_target) python3 scripts/editorial_agent.py review ;;
            *) python3 scripts/editorial_agent.py triage ;;
          esac
