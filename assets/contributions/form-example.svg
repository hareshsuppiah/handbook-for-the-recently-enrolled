<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 922" role="img" aria-labelledby="title"><title id="title">Worked example: a missing topic</title><rect width="720" height="922" fill="#f7f3e9"/><g font-family="Arial,sans-serif" fill="#243b42"><text x="28" y="40" font-size="23" font-weight="bold">Worked example: a missing topic</text><rect x="24" y="64" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="93" font-size="19" font-weight="bold">1. Add a title</text><text x="42" y="121" font-size="16">Add advice on building a peer group when working remotely</text><path d="M360 149 v15 m-5 -5 l5 5 5 -5" stroke="#53776d" fill="none"/><rect x="24" y="168" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="197" font-size="19" font-weight="bold">2. What kind of improvement are you suggesting?</text><text x="42" y="225" font-size="16">Choose: Add a missing question, topic, checklist, template or example</text><path d="M360 253 v15 m-5 -5 l5 5 5 -5" stroke="#53776d" fill="none"/><rect x="24" y="272" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="301" font-size="19" font-weight="bold">3. Where in the handbook does this apply?</text><text x="42" y="329" font-size="16">Starting a doctorate / first 90 days</text><path d="M360 357 v15 m-5 -5 l5 5 5 -5" stroke="#53776d" fill="none"/><rect x="24" y="376" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="405" font-size="19" font-weight="bold">4. What did you notice?</text><text x="42" y="433" font-size="16">I could not find a practical way to meet other researchers.</text><path d="M360 461 v15 m-5 -5 l5 5 5 -5" stroke="#53776d" fill="none"/><rect x="24" y="480" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="509" font-size="19" font-weight="bold">5. What would you change?</text><text x="42" y="537" font-size="16">Add a short guide to finding or starting a peer group.</text><path d="M360 565 v15 m-5 -5 l5 5 5 -5" stroke="#53776d" fill="none"/><rect x="24" y="584" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="613" font-size="19" font-weight="bold">6. How would this help a graduate researcher?</text><text x="42" y="641" font-size="16">It would give an isolated student a next step.</text><path d="M360 669 v15 m-5 -5 l5 5 5 -5" stroke="#53776d" fill="none"/><rect x="24" y="688" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="717" font-size="19" font-weight="bold">7. Finish the remaining fields and check privacy</text><text x="42" y="745" font-size="16">Choose the stage and credit; add a source if you have one.</text><path d="M360 773 v15 m-5 -5 l5 5 5 -5" stroke="#53776d" fill="none"/><rect x="24" y="792" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="821" font-size="19" font-weight="bold">8. Preview your answers, then submit</text><text x="42" y="849" font-size="16">Your suggestion and GitHub username will be public.</text></g></svg>