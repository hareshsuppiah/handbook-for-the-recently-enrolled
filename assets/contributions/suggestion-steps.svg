<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img" aria-labelledby="title"><title id="title">Your suggestion: from question to published change</title><rect width="720" height="610" fill="#f7f3e9"/><g font-family="Arial,sans-serif" fill="#243b42"><text x="28" y="40" font-size="23" font-weight="bold">Your suggestion: from question to published change</text><rect x="24" y="64" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="93" font-size="19" font-weight="bold">1. You submit one suggestion</text><text x="42" y="121" font-size="16">Use the form; no coding or finished chapter required.</text><path d="M360 149 v15 m-5 -5 l5 5 5 -5" stroke="#53776d" fill="none"/><rect x="24" y="168" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="197" font-size="19" font-weight="bold">2. An editor reviews your suggestion</text><text x="42" y="225" font-size="16">The editor may ask you for a source or clarification.</text><path d="M360 253 v15 m-5 -5 l5 5 5 -5" stroke="#53776d" fill="none"/><rect x="24" y="272" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="301" font-size="19" font-weight="bold">3. A human or available AI agent drafts the change</text><text x="42" y="329" font-size="16">Approval starts drafting. It does not publish the wording.</text><path d="M360 357 v15 m-5 -5 l5 5 5 -5" stroke="#53776d" fill="none"/><rect x="24" y="376" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="405" font-size="19" font-weight="bold">4. An editor reviews the actual edits</text><text x="42" y="433" font-size="16">A pull request shows the proposed changes together.</text><path d="M360 461 v15 m-5 -5 l5 5 5 -5" stroke="#53776d" fill="none"/><rect x="24" y="480" width="672" height="82" rx="10" fill="white" stroke="#53776d"/><text x="42" y="509" font-size="19" font-weight="bold">5. Accepted changes are published</text><text x="42" y="537" font-size="16">Follow the issue for the decision and published link.</text></g></svg>
