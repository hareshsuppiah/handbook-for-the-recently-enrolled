bibliography: references.bib

filters:
  - filters/page-comics.lua

format:
  html:
    page-layout: full
    grid:
      sidebar-width: 320px
      body-width: 720px
      margin-width: 220px
      gutter-width: 1.5rem
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    number-sections: false
    code-copy: true
    link-external-newwindow: true
    include-in-header: includes/cloudflare-analytics.html
    include-before-body: includes/design-contract.html
    include-after-body: includes/responsive-navigation.html
  pdf:
    documentclass: scrreprt

language:
  title-block-author-single: "Project lead and founding editor"
