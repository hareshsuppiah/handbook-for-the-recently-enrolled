project:
  type: book
  output-dir: _site

book:
  title: "The Handbook for the Recently Enrolled"
  subtitle: "An Operating Manual for Graduate Researchers"
  author:
    - name: "Haresh Suppiah"
      roles: ["Project lead", "Founding editor"]
  date: last-modified
  favicon: assets/favicon.svg
  site-url: https://hareshsuppiah.github.io/handbook-for-the-recently-enrolled/
  page-navigation: true
  search:
    location: sidebar
    type: textbox
    limit: 20
  sidebar:
    style: docked
    logo: assets/cover-final.png
    collapse-level: 1
  chapters:
    - index.qmd
    - status.qmd
    - part: "Starting your doctorate"
      chapters:
        - chapters/part-01/01-phd-and-good-enough.qmd
        - chapters/part-01/02-first-90-days.qmd
        - chapters/part-01/03-provisional-plan.qmd
    - part: "Working with supervisors"
      chapters:
        - chapters/part-02/04-roles-and-expectations.qmd
        - chapters/part-02/05-meetings-and-records.qmd
        - chapters/part-02/06-feedback-and-independence.qmd
    - part: "Choosing a research direction"
      chapters:
        - chapters/part-03/07-problem-gap-contribution.qmd
        - chapters/part-03/08-topic-due-diligence.qmd
        - chapters/part-03/09-questions-and-pivots.qmd
    - part: "Finding and using evidence"
      chapters:
        - chapters/part-04/10-search-ladder.qmd
        - chapters/part-04/11-reproducible-searching.qmd
        - chapters/part-04/12-reading-and-synthesis.qmd
    - part: "Designing your research"
      chapters:
        - chapters/part-05/13-design-alignment.qmd
        - chapters/part-05/14-sampling-measurement-pilots.qmd
        - chapters/part-05/15-rigour-and-variation.qmd
    - part: "Ethics, integrity and governance"
      chapters:
        - chapters/part-06/16-ethics-privacy-consent.qmd
        - chapters/part-06/17-integrity-governance-ai.qmd
        - chapters/part-06/18-authorship-collaboration-corrections.qmd
    - part: "Data, code and reproducibility"
      chapters:
        - chapters/part-07/19-data-management-storage.qmd
        - chapters/part-07/20-data-states-provenance.qmd
        - chapters/part-07/21-reproducible-workflows.qmd
    - part: "Choosing research tools"
